<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Von WebSafe blockiert</title>
  <link rel="stylesheet" href="../../src/pages/shared/ui.css">
  <link rel="stylesheet" href="../../src/pages/blocked/blocked.css">
</head>
<body>
  <main class="blocked-shell">
    <div class="shield" aria-hidden="true">✓</div>
    <p class="eyebrow">WEBSAFE HAT EINGEGRIFFEN</p>
    <h1>Diese Seite wurde blockiert.</h1>
    <p class="explanation">Diese Seite wurde wegen möglicher pornografischer Inhalte blockiert.</p>
    <div class="url-box">
      <span>Blockierte Adresse</span>
      <code>https://unsafe-popup.example/redirect?campaign=adult-ad</code>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="button">Sicher zurück</button>
      <button class="btn btn-secondary" type="button">Tab schließen</button>
    </div>
    <p class="privacy">Die Prüfung fand lokal in deinem Browser statt.</p>
  </main>
</body>
</html>
