name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: websafe-extension
          path: dist/
          if-no-files-found: error
